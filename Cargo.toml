[workspace]
members = [
    "engine",
    "python-bindings",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Chain Reaction Engine Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
proptest = "1"
criterion = "0.5"
clap = { version = "4", features = ["derive"] }
colored = "2"
